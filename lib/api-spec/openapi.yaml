openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: public-patent-tools
    description: Public USPTO-backed patent intelligence tools
paths:
  /portal/admin/firm-benchmark:
    get:
      operationId: getFirmBenchmarkStatus
      responses:
        "200":
          description: Administrator-only firm dataset status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmBenchmarkStatus"
  /portal/admin/firm-benchmark/refresh:
    post:
      operationId: refreshFirmBenchmark
      responses:
        "202":
          description: Background refresh accepted or already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmBenchmarkStatus"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /public-tools/portfolio/analyze:
    post:
      operationId: analyzePublicPortfolio
      tags: [public-patent-tools]
      summary: Analyze a public U.S. patent portfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicPortfolioInput"
      responses:
        "200":
          description: Portfolio analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPortfolioAnalysis"
        "400":
          description: Invalid company name
        "429":
          description: Rate limit exceeded
        "502":
          description: USPTO data unavailable
  /public-tools/portfolio/advanced:
    post:
      operationId: analyzePublicPortfolioAdvanced
      tags: [public-patent-tools]
      summary: Analyze prosecution details for selected USPTO applicants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicPortfolioAdvancedInput"
      responses:
        "200":
          description: Advanced patent portfolio metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPortfolioAdvancedAnalysis"
        "400":
          description: Invalid applicant selection
        "429":
          description: Rate limit exceeded
        "502":
          description: USPTO data unavailable
  /public-tools/examiner/analyze:
    post:
      operationId: analyzePublicExaminer
      tags: [public-patent-tools]
      summary: Analyze a USPTO examiner or art unit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicExaminerInput"
      responses:
        "200":
          description: Examiner or art-unit analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicExaminerAnalysis"
        "400":
          description: Invalid examiner or art-unit search
        "429":
          description: Rate limit exceeded
        "502":
          description: USPTO data unavailable
  /public-tools/examiner/rce-continuation/{jobId}:
    get:
      operationId: getPublicExaminerRceContinuation
      tags: [public-patent-tools]
      summary: Retrieve cached RCE and continuation analysis progress
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
            pattern: "^[a-f0-9]{64}$"
      responses:
        "200":
          description: Independent RCE and continuation metrics and source coverage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicExaminerRceContinuation"
        "404":
          description: Analysis not found
  /public-tools/inquiry:
    post:
      operationId: submitPublicToolInquiry
      tags: [public-patent-tools]
      summary: Submit an inquiry from a public patent tool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicToolInquiryInput"
      responses:
        "200":
          description: Inquiry accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicToolInquiryResult"
        "400":
          description: Invalid inquiry
        "429":
          description: Rate limit exceeded
        "500":
          description: Inquiry delivery unavailable
components:
  schemas:
    FirmBenchmarkStatus:
      type: object
      required: [state, applicationCount, completedCustomerNumbers, totalCustomerNumbers, startedAt, completedAt, error]
      properties:
        state:
          type: string
        applicationCount:
          type: integer
        completedCustomerNumbers:
          type: integer
        totalCustomerNumbers:
          type: integer
        startedAt:
          type: ["string", "null"]
        completedAt:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
    PublicFirmBenchmark:
      type: object
      required: [lines, excludedApplications, companyApplications, datasetUpdatedAt, filingDateStart, filingDateEnd, footnote]
      properties:
        excludedApplications:
          type: integer
        companyApplications:
          type: integer
        datasetUpdatedAt:
          type: ["string", "null"]
        filingDateStart:
          type: ["string", "null"]
        filingDateEnd:
          type: ["string", "null"]
        footnote:
          type: string
        lines:
          type: array
          items:
            type: object
            required: [metric, value, unit, denominator, companyDenominator, coverage]
            properties:
              metric:
                type: string
                enum: [allowanceRate, allowedWithTwoActionsRate, officeActionsPerPatent, rceRate, timeToGrantYears]
              value:
                type: number
              unit:
                type: string
                enum: [percent, count, years]
              denominator:
                type: integer
              companyDenominator:
                type: integer
              coverage:
                type: number
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PublicPortfolioInput:
      type: object
      additionalProperties: false
      required: [companyName]
      properties:
        companyName:
          type: string
          minLength: 2
          maxLength: 120
        selectedApplicantNames:
          type: array
          maxItems: 500
          items:
            type: string
            minLength: 2
            maxLength: 200
        additionalCompanyNames:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 2
            maxLength: 200
    PublicFilingTrend:
      type: object
      additionalProperties: false
      required: [year, count]
      properties:
        year:
          type: integer
        count:
          type: integer
          minimum: 0
    PublicTechnologyArea:
      type: object
      additionalProperties: false
      required: [code, label, count, classifications]
      properties:
        code:
          type: string
        label:
          type: string
        count:
          type: integer
          minimum: 0
        classifications:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, count]
            properties:
              code:
                type: string
              count:
                type: integer
                minimum: 0
    PublicCompanyNameDiscovery:
      type: object
      required: [searchedNames, sources, warnings]
      properties:
        searchedNames:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            type: object
            required: [label, url, retrievedAt, names]
            properties:
              label:
                type: string
              url:
                type: string
              retrievedAt:
                type: string
              names:
                type: array
                items:
                  type: string
        warnings:
          type: array
          items:
            type: string
    PublicApplicantCandidate:
      type: object
      additionalProperties: false
      required: [name, count]
      properties:
        name:
          type: string
        count:
          type: integer
          minimum: 0
    PublicPatentApplication:
      type: object
      additionalProperties: false
      required: [applicationNumber, title, filingDate, publicationNumber, publicationDate, status, url]
      properties:
        applicationNumber:
          type: string
        title:
          type: string
        filingDate:
          type: ["string", "null"]
        publicationNumber:
          type: ["string", "null"]
        publicationDate:
          type: ["string", "null"]
        status:
          type: string
        url:
          type: string
    PublicPatentGrant:
      type: object
      additionalProperties: false
      required: [patentNumber, title, grantDate, technologyArea, applicationNumber, url]
      properties:
        patentNumber:
          type: string
        title:
          type: string
        grantDate:
          type: ["string", "null"]
        technologyArea:
          type: string
        applicationNumber:
          type: string
        url:
          type: string
    PublicDataCoverage:
      type: object
      additionalProperties: false
      required: [source, retrievedAt, totalMatchesReported, recordsAnalyzed, resultLimit, truncated, note]
      properties:
        source:
          type: string
        retrievedAt:
          type: string
          format: date-time
        totalMatchesReported:
          type: integer
          minimum: 0
        recordsAnalyzed:
          type: integer
          minimum: 0
        resultLimit:
          type: integer
          minimum: 0
        truncated:
          type: boolean
        note:
          type: string
    PublicPortfolioAnalysis:
      type: object
      additionalProperties: false
      required:
        - companyName
        - matchedApplicantNames
        - selectionRequired
        - applicantCandidates
        - identifiedGrantedPatents
        - identifiedPendingApplications
        - expiredInactivePatents
        - recentGrantCount
        - activePatentCount
        - activePatentCountNote
        - filingTrends
        - topTechnologyAreas
        - recentApplications
        - recentGrants
        - coverage
      properties:
        companyName:
          type: string
        nameDiscovery:
          $ref: "#/components/schemas/PublicCompanyNameDiscovery"
        matchedApplicantNames:
          type: array
          items:
            type: string
        selectionRequired:
          type: boolean
        applicantCandidates:
          type: array
          items:
            $ref: "#/components/schemas/PublicApplicantCandidate"
        identifiedGrantedPatents:
          type: integer
          minimum: 0
        identifiedPendingApplications:
          type: integer
          minimum: 0
        expiredInactivePatents:
          type: ["integer", "null"]
          minimum: 0
        recentGrantCount:
          type: integer
          minimum: 0
        activePatentCount:
          type: ["integer", "null"]
          minimum: 0
        activePatentCountNote:
          type: string
        filingTrends:
          type: array
          items:
            $ref: "#/components/schemas/PublicFilingTrend"
        grantTrends:
          description: Full-scope grant counts by grant year, not a sample of recent grants.
          type: array
          items:
            $ref: "#/components/schemas/PublicFilingTrend"
        topTechnologyAreas:
          type: array
          items:
            $ref: "#/components/schemas/PublicTechnologyArea"
        recentApplications:
          type: array
          items:
            $ref: "#/components/schemas/PublicPatentApplication"
        recentGrants:
          type: array
          items:
            $ref: "#/components/schemas/PublicPatentGrant"
        coverage:
          $ref: "#/components/schemas/PublicDataCoverage"
    PublicPortfolioAdvancedInput:
      type: object
      additionalProperties: false
      required: [selectedApplicantNames]
      properties:
        selectedApplicantNames:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            minLength: 2
            maxLength: 200
    PublicPortfolioArtUnit:
      type: object
      additionalProperties: false
      required: [artUnit, applicationCount, portfolioSharePercent]
      properties:
        artUnit:
          type: string
        applicationCount:
          type: integer
          minimum: 0
        portfolioSharePercent:
          type: number
          minimum: 0
          maximum: 100
    PublicPortfolioExaminer:
      type: object
      additionalProperties: false
      required: [examinerName, artUnit, applicationCount]
      properties:
        examinerName:
          type: string
        artUnit:
          type: ["string", "null"]
        applicationCount:
          type: integer
          minimum: 0
    PublicPendingAgeBucket:
      type: object
      additionalProperties: false
      required: [label, count, sharePercent]
      properties:
        label:
          type: string
        count:
          type: integer
          minimum: 0
        sharePercent:
          type: number
          minimum: 0
          maximum: 100
    PublicPortfolioAdvancedAnalysis:
      type: object
      additionalProperties: false
      required: [prosecutionEfficiency, topArtUnits, outsideCounsel, portfolioInsights, coverage]
      properties:
        firmBenchmark:
          $ref: "#/components/schemas/PublicFirmBenchmark"
        prosecutionEfficiency:
          type: object
          additionalProperties: false
          required: [applicationsWithHistories, averageOfficeActionsPerGrantedPatent, officeActionDenominator, rceRate, rceApplications, rceDenominator, examinerInterviewRate, interviewApplications, interviewDenominator, allowedWithTwoOrFewerActionsRate, allowedWithTwoOrFewerActions, allowedWithHistory, filingDateStart, filingDateEnd]
          properties:
            applicationsWithHistories:
              type: integer
              minimum: 0
            averageOfficeActionsPerGrantedPatent:
              type: ["number", "null"]
              minimum: 0
            officeActionDenominator:
              type: integer
              minimum: 0
            rceRate:
              type: ["number", "null"]
              minimum: 0
              maximum: 100
            rceApplications:
              type: integer
              minimum: 0
            rceDenominator:
              type: integer
              minimum: 0
            examinerInterviewRate:
              type: ["number", "null"]
              minimum: 0
              maximum: 100
            interviewApplications:
              type: integer
              minimum: 0
            interviewDenominator:
              type: integer
              minimum: 0
            allowedWithTwoOrFewerActionsRate:
              type: ["number", "null"]
              minimum: 0
              maximum: 100
            allowedWithTwoOrFewerActions:
              type: integer
              minimum: 0
            allowedWithHistory:
              type: integer
              minimum: 0
            filingDateStart:
              type: ["string", "null"]
            filingDateEnd:
              type: ["string", "null"]
        topArtUnits:
          type: array
          items:
            $ref: "#/components/schemas/PublicPortfolioArtUnit"
        outsideCounsel:
          type: object
          additionalProperties: false
          required: [available, label, note, sampleSize, entries]
          properties:
            available:
              type: boolean
            label:
              type: string
            note:
              type: string
            sampleSize:
              type: integer
              minimum: 0
            entries:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [name, applicationCount, portfolioSharePercent]
                properties:
                  name:
                    type: string
                  applicationCount:
                    type: integer
                    minimum: 0
                  portfolioSharePercent:
                    type: number
                    minimum: 0
                    maximum: 100
        portfolioInsights:
          type: object
          additionalProperties: false
          required: [overallAllowanceRate, knownFinalOutcomes, averageTimeToGrantMonths, grantDurationSampleSize, averagePendingAgeYears, pendingAgeSampleSize, pendingAgeBuckets, topExaminers, examinerSampleSize]
          properties:
            overallAllowanceRate:
              type: ["number", "null"]
              minimum: 0
              maximum: 100
            knownFinalOutcomes:
              type: integer
              minimum: 0
            averageTimeToGrantMonths:
              type: ["number", "null"]
              minimum: 0
            grantDurationSampleSize:
              type: integer
              minimum: 0
            averagePendingAgeYears:
              type: ["number", "null"]
              minimum: 0
            pendingAgeSampleSize:
              type: integer
              minimum: 0
            pendingAgeBuckets:
              type: array
              items:
                $ref: "#/components/schemas/PublicPendingAgeBucket"
            topExaminers:
              type: array
              items:
                $ref: "#/components/schemas/PublicPortfolioExaminer"
            examinerSampleSize:
              type: integer
              minimum: 0
        coverage:
          $ref: "#/components/schemas/PublicDataCoverage"
    PublicExaminerInput:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: string
          minLength: 2
          maxLength: 100
        selectedExaminerName:
          type: string
          minLength: 2
          maxLength: 120
    PublicExaminerBreakdown:
      type: object
      additionalProperties: false
      required: [examinerName, count]
      properties:
        examinerName:
          type: string
        count:
          type: integer
          minimum: 0
    PublicExaminerHistoricalEvidence:
      type: object
      required: [role, applicationNumber, patentNumber, issueDate, sourceUrl]
      properties:
        role:
          type: string
          enum: [primary, assistant]
        applicationNumber:
          type: string
        patentNumber:
          type: string
        issueDate:
          type: string
        sourceUrl:
          type: string
    PublicExaminerHistorySummary:
      type: object
      required: [coverageStatus, confidence, confidenceNote, source, yearsObserved, distinctApplicationsVerified, totalHistoricallyExamined, transitionStatus, note, evidence]
      properties:
        coverageStatus:
          type: string
          enum: [sampled, historical]
        confidence:
          type: string
          enum: [low, medium, high]
        confidenceNote:
          type: string
        source:
          type: string
        yearsObserved:
          type: ["number", "null"]
        distinctApplicationsVerified:
          type: integer
        totalHistoricallyExamined:
          type: ["integer", "null"]
        transitionStatus:
          type: string
          enum: [observed_sequence, not_established]
        note:
          type: string
        earliestPrimary:
          $ref: "#/components/schemas/PublicExaminerHistoricalEvidence"
        earliestAssistant:
          $ref: "#/components/schemas/PublicExaminerHistoricalEvidence"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/PublicExaminerHistoricalEvidence"
    PublicExaminerActivityEvidence:
      type: object
      required: [patentNumber, issueDate, sourceUrl, note]
      properties:
        patentNumber:
          type: string
        issueDate:
          type: string
        sourceUrl:
          type: string
        note:
          type: string
    PublicExaminerRoleEvidence:
      type: object
      required: [role, patentNumber, issueDate, sourceUrl, note]
      properties:
        role:
          type: ["string", "null"]
          enum: [primary, assistant, null]
        patentNumber:
          type: ["string", "null"]
        issueDate:
          type: ["string", "null"]
        sourceUrl:
          type: ["string", "null"]
        note:
          type: string
        earliestActivity:
          $ref: "#/components/schemas/PublicExaminerActivityEvidence"
        history:
          $ref: "#/components/schemas/PublicExaminerHistorySummary"
    PublicExaminerBehaviorMetric:
      type: object
      additionalProperties: false
      required: [rate, numerator, denominator, note]
      properties:
        rate:
          type: ["number", "null"]
          minimum: 0
          maximum: 100
        numerator:
          type: integer
          minimum: 0
        denominator:
          type: integer
          minimum: 0
        note:
          type: string
    PublicExaminerRceContinuation:
      type: object
      required: [id, state, calculationVersion, cohortCutoff, eligibleApplications, excludedApplications, completedApplications, retrievedAt, rce, continuation, note]
      properties:
        id:
          type: string
        state:
          type: string
          enum: [queued, running, complete, partial]
        calculationVersion:
          type: string
        cohortCutoff:
          type: string
        eligibleApplications:
          type: integer
        excludedApplications:
          type: integer
        completedApplications:
          type: integer
        retrievedAt:
          type: ["string", "null"]
        rce:
          $ref: "#/components/schemas/PublicExaminerBehaviorMetric"
        continuation:
          $ref: "#/components/schemas/PublicExaminerBehaviorMetric"
        note:
          type: string
    PublicExaminerAnalysis:
      type: object
      additionalProperties: false
      required:
        - query
        - searchType
        - examinerName
        - artUnit
        - identifiedApplications
        - disposedApplications
        - allowedApplications
        - abandonedApplications
        - estimatedAllowanceRate
        - averageProsecutionDurationMonths
        - selectionRequired
        - examinerCandidates
        - topExaminers
        - calculationNote
        - coverage
      properties:
        query:
          type: string
        applicationNumberContext:
          type: string
        searchType:
          type: string
          enum: [examiner, art-unit]
        examinerName:
          type: ["string", "null"]
        artUnit:
          type: ["string", "null"]
        identifiedApplications:
          type: integer
          minimum: 0
        disposedApplications:
          type: integer
          minimum: 0
        allowedApplications:
          type: integer
          minimum: 0
        abandonedApplications:
          type: integer
          minimum: 0
        estimatedAllowanceRate:
          type: ["number", "null"]
          minimum: 0
          maximum: 100
        averageProsecutionDurationMonths:
          type: ["number", "null"]
          minimum: 0
        selectionRequired:
          type: boolean
        examinerCandidates:
          type: array
          items:
            $ref: "#/components/schemas/PublicExaminerBreakdown"
        topExaminers:
          type: array
          items:
            $ref: "#/components/schemas/PublicExaminerBreakdown"
        roleEvidence:
          $ref: "#/components/schemas/PublicExaminerRoleEvidence"
        rceContinuationJobId:
          type: string
        allowanceBenchmarks:
          type: object
          additionalProperties: false
          required:
            - examinerAllowanceRate
            - artUnitAllowanceRate
            - technologyCenterAllowanceRate
            - artUnit
            - technologyCenter
            - artUnitApplications
            - technologyCenterApplications
            - artUnitDisposedApplications
            - technologyCenterDisposedApplications
            - calculationNote
          properties:
            examinerAllowanceRate:
              type: ["number", "null"]
              minimum: 0
              maximum: 100
            artUnitAllowanceRate:
              type: ["number", "null"]
              minimum: 0
              maximum: 100
            technologyCenterAllowanceRate:
              type: ["number", "null"]
              minimum: 0
              maximum: 100
            artUnit:
              type: ["string", "null"]
            technologyCenter:
              type: ["string", "null"]
            artUnitApplications:
              type: integer
              minimum: 0
            technologyCenterApplications:
              type: integer
              minimum: 0
            artUnitDisposedApplications:
              type: integer
              minimum: 0
            technologyCenterDisposedApplications:
              type: integer
              minimum: 0
            calculationNote:
              type: string
        officeActionAnalytics:
          type: object
          additionalProperties: false
          required:
            - applicationsWithEventData
            - applicationsWithOfficeAction
            - applicationsWithFinalRejection
            - applicationsWithRestriction
            - averageNonFinalActionsPerApplication
            - averageFinalActionsPerApplication
            - medianMonthsFilingToFirstAction
          properties:
            applicationsWithEventData:
              type: integer
              minimum: 0
            applicationsWithOfficeAction:
              type: integer
              minimum: 0
            applicationsWithFinalRejection:
              type: integer
              minimum: 0
            applicationsWithRestriction:
              type: integer
              minimum: 0
            averageNonFinalActionsPerApplication:
              type: number
              minimum: 0
            averageFinalActionsPerApplication:
              type: number
              minimum: 0
            medianMonthsFilingToFirstAction:
              type: ["number", "null"]
              minimum: 0
            continuationRce:
              $ref: "#/components/schemas/PublicExaminerBehaviorMetric"
            quarterEndConcentration:
              $ref: "#/components/schemas/PublicExaminerBehaviorMetric"
        interviewAnalytics:
          type: object
          additionalProperties: false
          required:
            - applicationsWithEventData
            - applicationsWithInterviewSummary
            - interviewSummaryAllowed
            - interviewSummaryAbandoned
            - interviewSummaryOther
            - applicationsWithoutInterviewSummary
            - noSummaryAllowed
            - noSummaryAbandoned
            - noSummaryOther
          properties:
            applicationsWithEventData:
              type: integer
              minimum: 0
            applicationsWithInterviewSummary:
              type: integer
              minimum: 0
            interviewSummaryAllowed:
              type: integer
              minimum: 0
            interviewSummaryAbandoned:
              type: integer
              minimum: 0
            interviewSummaryOther:
              type: integer
              minimum: 0
            applicationsWithoutInterviewSummary:
              type: integer
              minimum: 0
            noSummaryAllowed:
              type: integer
              minimum: 0
            noSummaryAbandoned:
              type: integer
              minimum: 0
            noSummaryOther:
              type: integer
              minimum: 0
        calculationNote:
          type: string
        coverage:
          $ref: "#/components/schemas/PublicDataCoverage"
    PublicToolInquiryInput:
      type: object
      additionalProperties: false
      required: [name, company, email, tool, consent]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        company:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
          maxLength: 254
        message:
          type: string
          maxLength: 2000
        tool:
          type: string
          enum: [portfolio-analyzer, examiner-intelligence]
        consent:
          type: boolean
        website:
          type: string
          maxLength: 200
    PublicToolInquiryResult:
      type: object
      additionalProperties: false
      required: [success]
      properties:
        success:
          type: boolean

